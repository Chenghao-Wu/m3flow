schema: task/v1

name: compute_adhesion
version: 1.1.0

description: >
  Interfacial interaction-energy density -<E_int> / (n_interfaces * A) from
  the group/group interaction energy recorded by the MD run (mJ/m2, or
  reduced units for lj). This is NOT the reversible work of adhesion (no
  entropy, surface reconstruction or separation path); the result states
  whether long-range (kspace) terms are included.

category: analysis

tags:
  - adhesion
  - interface

inputs:
  thermo:
    type: ThermodynamicSeries
    required: true
    description: Series containing an interaction-energy column.

parameters:
  interface_area:
    type: area
    description: >
      Area of one interface. Default: mean lateral box area (perpendicular
      to interface_normal) over the averaged samples.
  interface_normal:
    type: enum
    values: [x, y, z]
    default: z
  n_interfaces:
    type: integer
    default: 1
    description: >
      Number of polymer/substrate interfaces in the cell (2 for a periodic
      film-on-slab without vacuum).
  equilibration_fraction:
    type: number
    default: 0.5
    description: Fraction of the series discarded from the start; 0 <= f < 1.

outputs:
  result:
    type: AdhesionResult

requirements:
  observables:
    - interaction_energy

implementations:
  - provider: analysis
    default: true
