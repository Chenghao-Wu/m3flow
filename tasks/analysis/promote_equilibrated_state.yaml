schema: task/v1

name: promote_equilibrated_state
version: 1.1.0

description: >
  Promote a SimulationState to an EquilibratedState, gated on a passing
  EquilibrationReport. This is the only way EquilibratedState artifacts come
  into existence: running an equilibration protocol alone never suffices
  without scientific validation (plan §20). The report must have passed
  every check and be bound to this state (its subject fingerprint, or thermo
  evidence produced by the task run that produced the state); the runtime
  re-verifies the binding and that the state's files are carried unchanged.

category: validation

tags:
  - equilibration
  - validation
  - state

inputs:
  state:
    type: SimulationState
    required: true
  report:
    type: EquilibrationReport
    required: true

parameters:
  require_pass:
    type: boolean
    default: true
    description: >
      Must be true (kept for compatibility). Forced promotion was removed:
      continuing without certification means using the SimulationState
      directly.

outputs:
  state:
    type: EquilibratedState

implementations:
  - provider: analysis
    default: true
