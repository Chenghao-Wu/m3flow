schema: task/v1

name: run_npt
version: 1.1.0

description: Run molecular dynamics in the isothermal-isobaric (NPT) ensemble.

category: simulation

tags:
  - md
  - npt
  - thermodynamics
  - lammps

inputs:
  system:
    type: SimulationSystem
    required: false
  state:
    type: SimulationState
    required: false

parameters:
  temperature:
    type: temperature
    required: true
  pressure:
    type: pressure
    default: 1 bar
  duration:
    type: time
    required: true
  timestep:
    type: time
    default: 1 fs
  thermostat:
    type: enum
    values: [nose_hoover, langevin, berendsen]
    default: nose_hoover
  barostat:
    type: enum
    values: [nose_hoover, berendsen]
    default: nose_hoover
  tdamp:
    type: time
    default: 100 fs
  pdamp:
    type: time
    default: 1000 fs
  temperature_end:
    type: temperature
    description: If set, ramp temperature linearly from temperature to this value.
  pressure_end:
    type: pressure
    description: If set, ramp pressure linearly from pressure to this value.
  pressure_style:
    type: enum
    values: [iso, aniso, tri, xyz]
    default: iso
    description: >
      Barostat keyword style (LAMMPS fix nh): iso = isotropic, aniso =
      independent x/y/z at the same target, tri = aniso + box tilt,
      xyz = individual per-axis control (uses pressure_x/y/z).
  couple:
    type: enum
    values: [xyz, xy, xz, yz, none]
    default: xyz
    description: Axis coupling; only valid with pressure_style = xyz.
  pressure_x:
    type: pressure
    description: x-axis target (pressure_style = xyz); unset axes are not barostated.
  pressure_x_end:
    type: pressure
    description: If set, ramp the x-axis pressure to this value.
  pressure_y:
    type: pressure
    description: y-axis target (pressure_style = xyz).
  pressure_y_end:
    type: pressure
    description: If set, ramp the y-axis pressure to this value.
  pressure_z:
    type: pressure
    description: z-axis target (pressure_style = xyz).
  pressure_z_end:
    type: pressure
    description: If set, ramp the z-axis pressure to this value.
  sampling_interval:
    type: time
    default: 1 ps
  thermo_interval:
    type: time
    default: 0.1 ps
  seed:
    type: integer
    default: 12345
  interaction:
    type: map
    description: >
      Optional {"group_a": "...", "group_b": "..."} LAMMPS group selectors;
      adds a group/group interaction-energy column to the thermo series.

outputs:
  state:
    type: SimulationState
  trajectory:
    type: Trajectory
  log:
    type: SimulationLog
  thermo:
    type: ThermodynamicSeries

validation:
  - simulation_completed
  - no_nan
  - no_lost_atoms
  - trajectory_readable

implementations:
  - provider: lammps
    default: true

resources:
  cpu: 8
  walltime: 2 h
