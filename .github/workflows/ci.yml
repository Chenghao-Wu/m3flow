name: CI

# Gate for every push/PR (and for releases, via workflow_call): the Rust
# workspace tests plus the Python provider tests, which pin the scientific
# fixtures (unit conversions, NPT fix sets, statistics, evidence binding).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace --locked

  python-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install provider dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "providers[analysis,test]"
      - name: Test providers
        run: python -m pytest -q providers/tests
