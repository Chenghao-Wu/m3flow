name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel   # macos-13 retired Dec 2025; last Intel label, EOL Fall 2027
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --package m3flow-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist m3flow-$TAG-$TARGET
          cp target/$TARGET/release/m3flow LICENSE README.md m3flow-$TAG-$TARGET/
          tar -czf dist/m3flow-$TAG-$TARGET.tar.gz m3flow-$TAG-$TARGET

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist, "m3flow-$env:TAG-$env:TARGET" | Out-Null
          Copy-Item "target/$env:TARGET/release/m3flow.exe", LICENSE, README.md "m3flow-$env:TAG-$env:TARGET"
          Compress-Archive -Path "m3flow-$env:TAG-$env:TARGET" -DestinationPath "dist/m3flow-$env:TAG-$env:TARGET.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  build-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        working-directory: providers
        run: |
          pip install build
          python -m build --outdir ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: providers-python
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build-cli, build-providers]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo ${{ github.repository }} --generate-notes --verify-tag dist/*
